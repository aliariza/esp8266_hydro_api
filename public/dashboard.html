<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hydroponic Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>🌿 Hydroponic Dashboard</h1>
  <div class="readings">🌡 Temp: <span id="temp">--</span> °C</div>
  <div class="readings">💧 Humidity: <span id="hum">--</span> %</div>

  <div class="button-group">
    <button class="button" id="pumpBtn" onclick="togglePump()">Pump ON</button>
    <button class="button" id="lightBtn" onclick="toggleLight()">Light ON</button>
  </div>

  <canvas id="tempChart" width="400" height="200"></canvas>
  <canvas id="humChart" width="400" height="200"></canvas>

  <script src="script.js"></script>
</body>
</html>
